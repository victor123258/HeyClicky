name: Windows installer
on:
  push:
    branches: [main, 'arena/**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - name: Check native Windows helpers
        shell: powershell
        run: |
          try { ./scripts/windows-smoke.ps1 }
          catch {
            $detail = ($_ | Out-String).Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Host "::error title=Windows helper failure::$detail"
            exit 1
          }
      - run: npm run dist -- --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v5
        with:
          name: HeyClicky-Windows-x64
          path: dist/*.exe
          if-no-files-found: error
          retention-days: 30
